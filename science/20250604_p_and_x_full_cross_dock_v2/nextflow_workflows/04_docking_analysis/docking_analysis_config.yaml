datasets:
  fred:
    name: "FRED_1_poses"

analyses:
  datesplit:
    default:
      settings: "${params.datesplit_settings}"
      enabled_datasets: ["posit", "fred"]

  x_to_x:
    default:
      settings: "${params.x_to_x_scaffold_split}"
      enabled_datasets: ["posit"]
    five_refs:
      settings: "${params.x_to_x_scaffold_split_5_refs}"

  x_to_y:
    default:
      settings: "${params.x_to_y_scaffold_split}"
      enabled_datasets: ["posit"]
    five_refs:
      settings: "${params.x_to_y_scaffold_split_5_refs}"

  increasing_similarity:
    tanimoto_combo_aligned:
      settings: "${params.increasing_similarity_tanimoto_combo_aligned}"
      enabled_datasets: ["posit", "fred"]
    mcs:
      settings: "${params.increasing_similarity_mcs}"
      enabled_datasets: ["posit", "fred"]
    ecfp4:
      settings: "${params.increasing_similarity_ecfp4}"
      enabled_datasets: ["posit", "fred", "posit_multipose"]

